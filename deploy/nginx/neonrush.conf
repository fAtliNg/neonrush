# Neon Rush — гонка в браузере: https://neonrush.denisenkosergey.ru
# Статическая сборка Vite в /var/www/neonrush. Сертификат и редирект на HTTPS добавляет certbot --nginx.
server {
    server_name neonrush.denisenkosergey.ru;

    root /var/www/neonrush;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    # Сборка Vite: имена с хешем, можно кэшировать навсегда
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы новая сборка подхватывалась сразу
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
    listen [::]:80;
}
